default_stages: [pre-commit]
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.6.1
    hooks:
      - id: clang-format
        name: clang-format
        args:
          - --style=file
          - --version=19
        types_or: [c, c++]
        exclude: ^src/db/sqlite3\.(c|h)$

      - id: clang-tidy
        name: clang-tidy
        args:
          - --version=19
          - --quiet
          - --compile-commands=build/debug
          - --extra-arg=-std=c++17
        types: [c, c++]
        exclude: ^src/db/sqlite3\.(c|h)$
        require_serial: false
