name: One-time clang-format pass

on:
  push:
    branches:
      - fix/ci-windows-formatting

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-pass]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install clang-format 19
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-19
          clang-format-19 --version

      - name: Format C++ and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.cpp' '*.h' | grep -v '^src/db/sqlite3\.h$' || true)
          if (("${#files[@]}" > 0)); then
            clang-format-19 -i "${files[@]}"
          fi
          git rm .github/workflows/format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "chore: apply clang-format 19 [format-pass]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
