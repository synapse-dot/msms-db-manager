name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-latest
            platform: windows
          - name: Linux / glibc 2.31
            os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg packages
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-windows-x64-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Install wxWidgets with vcpkg
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg-root'
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $binaryCache | Out-Null
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          $env:VCPKG_ROOT = $vcpkgRoot
          $env:VCPKG_DEFAULT_BINARY_CACHE = $binaryCache
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install wxwidgets:x64-windows

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        run: cmake --preset ci-windows

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: cmake --build --preset ci-windows --config Release --parallel

      - name: Test (Windows)
        if: matrix.platform == 'windows'
        run: ctest --preset ci-windows

      - name: Stage artifact (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build\ci-windows\Release\msms.exe out\msms-manager.exe
          Copy-Item "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" out\ -ErrorAction SilentlyContinue

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: msms-manager-windows-x64
          path: out/
          if-no-files-found: error

      - name: Cache ccache objects
        if: matrix.platform == 'linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-glibc231-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-glibc231-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-

      - name: Cache wxWidgets source
        if: matrix.platform == 'linux'
        uses: actions/cache@v4
        with:
          path: build/ci-linux/_deps/wxwidgets-src
          key: wxwidgets-linux-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            wxwidgets-linux-

      - name: Configure, build, test and package (Linux; Ubuntu 20.04 container)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/ccache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$HOME/.cache/ccache:/tmp/.cache/ccache" \
            -w /src \
            ubuntu:20.04 bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
                build-essential git pkg-config ninja-build python3-pip ccache curl file \
                librsvg2-bin libgtk-3-dev libjpeg-dev libpng-dev libtiff-dev \
                libexpat1-dev libcurl4-openssl-dev
              python3 -m pip install --no-cache-dir cmake==3.27.9

              curl -fsSL -o /usr/local/bin/linuxdeploy \
                https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
              curl -fsSL -o /usr/local/bin/linuxdeploy-plugin-gtk \
                https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk.sh
              chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-gtk

              export PATH="/usr/local/bin:$PATH"
              export CCACHE_DIR=/tmp/.cache/ccache
              export CCACHE_BASEDIR=/src
              export APPIMAGE_EXTRACT_AND_RUN=1
              export DEPLOY_GTK_VERSION=3
              ccache --show-stats
              cmake --preset ci-linux
              cmake --build --preset ci-linux --parallel
              ctest --preset ci-linux

              mkdir -p AppDir/usr/bin out
              cp build/ci-linux/msms AppDir/usr/bin/msms-manager
              cp packaging/linux/msms-manager.desktop AppDir/
              cp packaging/linux/msms-manager.svg AppDir/
              rsvg-convert -w 256 -h 256 AppDir/msms-manager.svg > AppDir/msms-manager.png
              linuxdeploy --appdir AppDir --plugin gtk --desktop-file AppDir/msms-manager.desktop --icon-file AppDir/msms-manager.png --output appimage
              appimage=$(find . -maxdepth 1 -type f -name "*.AppImage" -print -quit)
              test -n "$appimage"
              cp "$appimage" out/MSMS_Manager-linux-x64.AppImage
              cp build/ci-linux/msms out/msms-manager-linux-x64
              ccache --show-stats
              chown -R "$(stat -c '%u:%g' /src)" /src/out
              chmod -R a+rwX /tmp/.cache/ccache
            '

      - name: Upload artifact (Linux binary)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: msms-manager-linux-x64-binary
          path: out/msms-manager-linux-x64
          if-no-files-found: error

      - name: Upload artifact (Linux AppImage)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: msms-manager-linux-x64-appimage
          path: out/MSMS_Manager-linux-x64.AppImage
          if-no-files-found: error

  advisory-quality:
    name: Advisory formatting and static analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install quality tools
        run: |
          sudo apt-get update
          # Assumes ubuntu-latest provides wxWidgets 3.2 development headers.
          sudo apt-get install --yes clang-format clang-tidy cmake ninja-build ccache \
            libwxgtk3.2-dev libsqlite3-dev

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.h' | grep -v '^src/db/sqlite3\.h$')
          if (("${#files[@]}" > 0)); then
            clang-format --dry-run --Werror "${files[@]}"
          fi

      - name: Configure for clang-tidy
        run: cmake --preset host-linux

      - name: Run clang-tidy (advisory)
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.cpp')
          if (("${#files[@]}" > 0)); then
            clang-tidy -p build/host-linux "${files[@]}"
          fi

      - name: Report advisory failure
        if: failure()
        run: echo "::warning::Advisory checks failed; see logs"
